<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>C · Widget flutuante</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0A0A0A;color:#E2E8F0}
a{color:#F59E0B;text-decoration:none}a:hover{color:#FCD34D}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 0%, #1F1A12 0%, #0A0A0A 60%); font-family: Inter, system-ui, sans-serif; color: #E2E8F0">

<div style="position: absolute; left: 22px; top: 28px; width: 346px; height: 216px; box-sizing: border-box; padding: 2px; border-radius: 18px; background: linear-gradient(135deg, #FCD34D, #92400E 40%, #F59E0B 70%, #78350F); opacity: 0.55">
<div style="width: 342px; height: 212px; box-sizing: border-box; border-radius: 16px; background: #111111; padding: 20px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px">
<span style="font-size: 26px; font-weight: 800; color: #FFFFFF">Ana Sousa</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #F59E0B">CONSULTORA IMOBILIÁRIA</span>
</div>
</div>

<div style="position: absolute; left: 14px; right: 14px; bottom: 96px; box-sizing: border-box; background: #141414; border: 1px solid rgba(217,119,6,0.4); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 40px rgba(217,119,6,0.15); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2A2A2A">
<div style="width: 40px; height: 40px; border-radius: 50%; background: #D97706; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #141414">AS</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 800; color: #FFFFFF">Ana Sousa</span>
<span style="font-size: 12px; color: #9CA3AF">Normalmente responde em minutos</span>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #F59E0B">2 / 3</span>
</div>
<div style="height: 3px; background: #2A2A2A"><div style="width: 66%; height: 3px; background: #D97706"></div></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: flex-end; padding: 10px 14px; background: #D97706; border-radius: 14px 14px 4px 14px; font-size: 14px; font-weight: 600; color: #141414">Arrendamento</div>
<div style="align-self: flex-start; max-width: 280px; padding: 10px 14px; background: #1F1F1F; border-radius: 14px 14px 14px 4px; font-size: 14px; line-height: 1.5">Procura casa para arrendar ou quer arrendar o seu imóvel?</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; min-height: 44px; border: 1px solid #D97706; border-radius: 100px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #F59E0B">Procuro casa</button>
<button type="button" style="flex-grow: 1; min-height: 44px; border: 1px solid #333333; border-radius: 100px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #E2E8F0">Tenho um imóvel</button>
</div>
<div style="font-size: 12px; color: #9CA3AF">A seguir: nome, e-mail e WhatsApp</div>
</div>
<div style="display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #2A2A2A">
<label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensagem</span><input type="text" placeholder="Escreva uma mensagem…" style="width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 14px; background: #0D0D0D; border: 1px solid #333333; border-radius: 100px; font-family: inherit; font-size: 14px; color: #FFFFFF"></label>
<button type="button" aria-label="Enviar" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #D97706; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
</div>
</div>

<button type="button" aria-label="Fechar chat" style="position: absolute; right: 18px; bottom: 24px; width: 56px; height: 56px; border: 0; border-radius: 50%; background: linear-gradient(135deg, #D97706, #F59E0B); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 30px rgba(217,119,6,0.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</body>
</html>
