name = "zx-cartao"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Imagens da LP (public/cartao-digital/img/*). O Worker trata tudo o resto.
[assets]
directory = "./public"

[vars]
PUBLIC_BASE_URL = ""
EMAIL_FROM = ""
EVOLUTION_INSTANCE = "avisos-cartao"
CF_BEACON_TOKEN = ""
ZX_CARD_SLUG = "zxlab"
PAYPAL_ENV = "sandbox"
PRODUCT_PRICE_EUR = "97.00"
PAYPAL_CLIENT_ID = ""
META_PIXEL_ID = ""
# A anon key do Supabase é pública por desenho (o painel usa-a no browser; a RLS protege os dados).
SUPABASE_ANON_KEY = ""

